StylesPath = .github/styles
MinAlertLevel = suggestion
Packages = write-good, proselint, Readability, Google, Microsoft, alex

# Run the custom scientific-English style on manuscript-like files.
# Markdown works best. LaTeX is supported as plain text with ignores for common TeX noise.
[*.{md,txt,tex}]
BasedOnStyles = ScientificEnglishDehype, write-good, proselint, Readability, Google, Microsoft, alex

# Academic manuscripts usually avoid contractions; keep Google/Microsoft suggestions out of CI errors.
Microsoft.Contractions = NO
Google.Contractions = NO

# Inclusive-language findings are useful review prompts, but should not fail manuscript CI by default.
alex.Condescending = warning

# External package README files are installed by `vale sync` and are not manuscript text.
[.github/styles/*/README.md]
BasedOnStyles =

# Inline ignores: math, citations/references, common LaTeX commands, URLs, and chemical-like formulae.
TokenIgnores = (\$[^$\n]+\$), (\\[a-zA-Z]+\*?(?:\[[^\]]*\])?(?:\{[^}]*\})*), (https?:\/\/[^\s]+), (?:Fig|Figs|Eq|Eqs|Table|Tables|Ref|Refs)\.\s?\d+[A-Za-z]?, \b[A-Z][a-z]?\d*(?:[A-Z][a-z]?\d*)+\b

# Block ignores: code fences and common LaTeX environments.
BlockIgnores = (?s)```.*?```, (?s)\\begin\{(?:equation|equation\*|align|align\*|table|table\*|figure|figure\*)\}.*?\\end\{(?:equation|equation\*|align|align\*|table|table\*|figure|figure\*)\}
