StylesPath = .github/styles
MinAlertLevel = suggestion

# Run the custom scientific-English style on manuscript-like files.
# Markdown works best. LaTeX is supported as plain text with ignores for common TeX noise.
[*.{md,txt,tex}]
BasedOnStyles = ScientificEnglishDehype

# Inline ignores: math, citations/references, common LaTeX commands, URLs, and chemical-like formulae.
TokenIgnores = (\$[^$\n]+\$), (\\[a-zA-Z]+\*?(?:\[[^\]]*\])?(?:\{[^}]*\})*), (https?:\/\/[^\s]+), (?:Fig|Figs|Eq|Eqs|Table|Tables|Ref|Refs)\.\s?\d+[A-Za-z]?, \b[A-Z][a-z]?\d*(?:[A-Z][a-z]?\d*)+\b

# Block ignores: code fences and common LaTeX environments.
BlockIgnores = (?s)```.*?```, (?s)\\begin\{(?:equation|equation\*|align|align\*|table|table\*|figure|figure\*)\}.*?\\end\{(?:equation|equation\*|align|align\*|table|table\*|figure|figure\*)\}
